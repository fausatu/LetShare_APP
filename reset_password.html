<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Réinitialiser le mot de passe - LetShare</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <!-- Left side - Illustration -->
        <div class="auth-illustration">
            <div class="illustration-content">
                <div class="illustration-icon">
                     <H1 class="illustration-title">LetShare</H1>
                </div>
                <h2 data-i18n="resetTitle">Réinitialisez votre mot de passe</h2>
                <p data-i18n="resetSubtitle">Créez un nouveau mot de passe sécurisé pour votre compte</p>
            </div>
        </div>
        
        <!-- Right side - Form -->
        <div class="auth-form-section">
            <div class="auth-form-box">
                <div class="auth-form-header">
                    <h1 data-i18n="newPasswordTitle">Nouveau mot de passe</h1>
                    <p data-i18n="newPasswordSubtitle">Entrez votre nouveau mot de passe</p>
                </div>
                
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage" style="display: none;"></div>
                
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label class="form-label" for="password" data-i18n="newPasswordLabel">Nouveau mot de passe</label>
                        <div style="position: relative;">
                            <input type="password" class="form-input" id="password" data-i18n-placeholder="passwordPlaceholder" placeholder="Au moins 6 caractères" required minlength="6">
                            <button type="button" class="password-toggle" id="togglePassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #6b7280; cursor: pointer; font-size: 1.2rem; padding: 0.5rem;">👁️</button>
                        </div>
                        <div id="passwordStrength" style="margin-top: 0.5rem; display: none;">
                            <div style="height: 4px; background: #e5e7eb; border-radius: 2px; overflow: hidden;">
                                <div id="passwordStrengthBar" style="height: 100%; width: 0%; transition: all 0.3s; background: #ef4444;"></div>
                            </div>
                            <p id="passwordStrengthText" style="font-size: 0.875rem; margin-top: 0.5rem; color: #6b7280;"></p>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword" data-i18n="confirmPasswordLabel">Confirmer le mot de passe</label>
                        <div style="position: relative;">
                            <input type="password" class="form-input" id="confirmPassword" data-i18n-placeholder="confirmPasswordPlaceholder" placeholder="Répétez le mot de passe" required minlength="6">
                            <button type="button" class="password-toggle" id="toggleConfirmPassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #6b7280; cursor: pointer; font-size: 1.2rem; padding: 0.5rem;">👁️</button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-login" id="resetPasswordBtn" data-i18n="resetPasswordBtn">Réinitialiser le mot de passe</button>
                </form>
                
                <div class="register-link">
                    <a href="login.html" data-i18n="backToLogin">← Retour à la connexion</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script>
    // Traductions FR/EN
    const translations = {
        fr: {
            resetTitle: "Réinitialisez votre mot de passe",
            resetSubtitle: "Créez un nouveau mot de passe sécurisé pour votre compte",
            newPasswordTitle: "Nouveau mot de passe",
            newPasswordSubtitle: "Entrez votre nouveau mot de passe",
            newPasswordLabel: "Nouveau mot de passe",
            passwordPlaceholder: "Au moins 6 caractères",
            confirmPasswordLabel: "Confirmer le mot de passe",
            confirmPasswordPlaceholder: "Répétez le mot de passe",
            resetPasswordBtn: "Réinitialiser le mot de passe",
            backToLogin: "← Retour à la connexion",
            errorNoToken: "Token de réinitialisation manquant ou invalide.",
            errorNoMatch: "Les mots de passe ne correspondent pas.",
            errorTooShort: "Le mot de passe doit contenir au moins 6 caractères.",
            resetting: "Réinitialisation...",
            resetSuccess: "Mot de passe réinitialisé avec succès ! Redirection vers la page de connexion...",
            resetError: "Erreur lors de la réinitialisation du mot de passe.",
            resetErrorGeneric: "Erreur lors de la réinitialisation. Veuillez réessayer.",
            passwordStrength: ["Très faible", "Faible", "Moyen", "Fort", "Très fort"],
            passwordStrengthForce: "Force: "
        },
        en: {
            resetTitle: "Reset your password",
            resetSubtitle: "Create a new secure password for your account",
            newPasswordTitle: "New password",
            newPasswordSubtitle: "Enter your new password",
            newPasswordLabel: "New password",
            passwordPlaceholder: "At least 6 characters",
            confirmPasswordLabel: "Confirm password",
            confirmPasswordPlaceholder: "Repeat the password",
            resetPasswordBtn: "Reset password",
            backToLogin: "← Back to login",
            errorNoToken: "Reset token missing or invalid.",
            errorNoMatch: "Passwords do not match.",
            errorTooShort: "Password must be at least 6 characters.",
            resetting: "Resetting...",
            resetSuccess: "Password successfully reset! Redirecting to login page...",
            resetError: "Error resetting password.",
            resetErrorGeneric: "Error during reset. Please try again.",
            passwordStrength: ["Very weak", "Weak", "Medium", "Strong", "Very strong"],
            passwordStrengthForce: "Strength: "
        }
    };

    function getBrowserLanguage() {
        const browserLang = navigator.language || navigator.userLanguage;
        if (browserLang.startsWith('fr')) return 'fr';
        return 'en';
    }
    function getCurrentLanguage() {
        const settings = JSON.parse(localStorage.getItem('userSettings') || '{}');
        if (settings.language) return settings.language;
        const storedLang = localStorage.getItem('language');
        if (storedLang) return storedLang;
        const browserLang = getBrowserLanguage();
        const newSettings = { language: browserLang };
        localStorage.setItem('userSettings', JSON.stringify(newSettings));
        return browserLang;
    }
    function t(key) {
        const lang = getCurrentLanguage();
        return translations[lang] && translations[lang][key] ? translations[lang][key] : (translations.en[key] || key);
    }
    function applyTranslations() {
        document.documentElement.lang = getCurrentLanguage();
        document.querySelectorAll('[data-i18n]').forEach(function(el) {
            const key = el.getAttribute('data-i18n');
            el.textContent = t(key);
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
            const key = el.getAttribute('data-i18n-placeholder');
            el.placeholder = t(key);
        });
    }
    // Appliquer à l'ouverture
    applyTranslations();
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            document.getElementById('errorMessage').textContent = t('errorNoToken');
            document.getElementById('errorMessage').classList.add('show');
            document.getElementById('resetPasswordForm').style.display = 'none';
        }
        
        // Password strength indicator
        function checkPasswordStrength(password) {
            let strength = 0;
            let feedback = [];
            
            if (password.length >= 6) strength += 1;
            else feedback.push(t('passwordPlaceholder'));
            
            if (password.length >= 8) strength += 1;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) {
                strength += 1;
            } else if (password.length > 0) {
                feedback.push(getCurrentLanguage() === 'fr' ? 'Majuscules et minuscules' : 'Uppercase and lowercase');
            }
            
            if (/\d/.test(password)) {
                strength += 1;
            } else if (password.length > 0) {
                feedback.push(getCurrentLanguage() === 'fr' ? 'Au moins un chiffre' : 'At least one digit');
            }
            
            if (/[^a-zA-Z\d]/.test(password)) {
                strength += 1;
            } else if (password.length > 0 && password.length >= 6) {
                feedback.push(getCurrentLanguage() === 'fr' ? 'Caractères spéciaux recommandés' : 'Special characters recommended');
            }
            
            const strengthText = translations[getCurrentLanguage()].passwordStrength;
            const strengthColors = ['#ef4444', '#f59e0b', '#eab308', '#10b981', '#059669'];
            return {
                score: strength,
                text: strengthText[strength] || '',
                color: strengthColors[strength] || '#ef4444',
                feedback: feedback
            };
        }
        
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const toggle = document.getElementById('togglePassword');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggle.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggle.textContent = '👁️';
            }
        });
        
        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            const confirmInput = document.getElementById('confirmPassword');
            const toggle = document.getElementById('toggleConfirmPassword');
            if (confirmInput.type === 'password') {
                confirmInput.type = 'text';
                toggle.textContent = '🙈';
            } else {
                confirmInput.type = 'password';
                toggle.textContent = '👁️';
            }
        });
        
        // Real-time password strength check
        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthDiv = document.getElementById('passwordStrength');
            const strengthBar = document.getElementById('passwordStrengthBar');
            const strengthText = document.getElementById('passwordStrengthText');
            
            if (password.length === 0) {
                strengthDiv.style.display = 'none';
                return;
            }
            
            strengthDiv.style.display = 'block';
            const strength = checkPasswordStrength(password);
            const percentage = (strength.score / 4) * 100;
            
            strengthBar.style.width = percentage + '%';
            strengthBar.style.background = strength.color;
            strengthText.textContent = t('passwordStrengthForce') + strength.text;
            strengthText.style.color = strength.color;
        });
        
        // Form submission
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resetPasswordBtn = document.getElementById('resetPasswordBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorMessage.textContent = t('errorNoMatch');
                errorMessage.classList.add('show');
                return;
            }
            
            // Validate password length
            if (password.length < 6) {
                errorMessage.textContent = t('errorTooShort');
                errorMessage.classList.add('show');
                return;
            }
            
            resetPasswordBtn.disabled = true;
            resetPasswordBtn.textContent = t('resetting');
            errorMessage.classList.remove('show');
            successMessage.style.display = 'none';
            
            try {
                const response = await fetch('api/auth/reset_password.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        token: token,
                        password: password 
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    successMessage.textContent = data.message || t('resetSuccess');
                    successMessage.style.display = 'block';
                    successMessage.style.background = '#f0fdf4';
                    successMessage.style.borderColor = '#10b981';
                    successMessage.style.color = '#059669';
                    
                    document.getElementById('resetPasswordForm').style.display = 'none';
                    
                    // Redirect to login page after 3 seconds
                    setTimeout(function() {
                        window.location.href = 'login.html?message=' + encodeURIComponent('Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant vous connecter.');
                    }, 3000);
                } else {
                    throw new Error(data.message || t('resetError'));
                }
            } catch (error) {
                errorMessage.textContent = error.message || t('resetErrorGeneric');
                errorMessage.classList.add('show');
            } finally {
                resetPasswordBtn.disabled = false;
                resetPasswordBtn.textContent = t('resetPasswordBtn');
            }
        });
    </script>
</body>
</html>
