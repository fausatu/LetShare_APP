name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.IONOS_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.IONOS_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.IONOS_FTP_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo, pdo_mysql

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-dev

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTP (lftp mirror)
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "Missing FTP secrets. Please configure IONOS_FTP_SERVER, IONOS_FTP_USERNAME, and IONOS_FTP_PASSWORD."
            exit 1
          fi

          lftp -e "
            set ftp:ssl-allow no;
            set ssl:verify-certificate no;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            mirror -R ./ / \
              --delete \
              --verbose \
              --exclude-glob .git* \
              --exclude-glob .github* \
              --exclude-glob node_modules \
              --exclude-glob *.env* \
              --exclude-glob database \
              --exclude-glob README.md;
            bye
          "
