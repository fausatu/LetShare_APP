name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.IONOS_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.IONOS_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.IONOS_FTP_PASSWORD }}
      FTP_TARGET_DIR: ${{ secrets.IONOS_FTP_TARGET_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo, pdo_mysql

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-dev

      - name: Deploy via FTP (lftp mirror)
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' }}
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y lftp
          TARGET_DIR="${FTP_TARGET_DIR:-/letshare_ci/}"
          timeout 20m lftp -e "
            set cmd:fail-exit yes;
            set sftp:auto-confirm yes;
            set net:max-retries 1;
            set net:reconnect-interval-base 5;
            set net:timeout 20;
            open -u $FTP_USERNAME,$FTP_PASSWORD sftp://$FTP_SERVER;
            mirror -R ./ $TARGET_DIR \
              --delete \
              --verbose \
              --exclude-glob .git* \
              --exclude-glob .github* \
              --exclude-glob node_modules \
              --exclude-glob *.env* \
              --exclude-glob database \
              --exclude-glob README.md;
            bye
          "

      - name: Warn if FTP secrets are not configured
        if: ${{ env.FTP_SERVER == '' || env.FTP_USERNAME == '' || env.FTP_PASSWORD == '' }}
        run: echo "::warning::FTP secrets (IONOS_FTP_SERVER, IONOS_FTP_USERNAME, IONOS_FTP_PASSWORD) are not configured. Deployment was skipped."
